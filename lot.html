<body class="page-lot">
<div id="review"></div>
<header id="top"></header>

<main class="lot-page" data-lot-root>
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb" data-crumbs></nav>
    <div class="lot-top">
      <section class="gallery" aria-label="Photos" data-gallery></section>
      <aside class="buy info" aria-label="About this lot" data-buy data-note="오른쪽 칸 순서 = 정품 → 상품 → 가격 → 상태 → 버튼(Fashionphile·KREAM·Loupe 세 곳 공통). 판매 방식 A/B와 상태 10가지는 위 검토 막대에서 바꿔 볼 수 있다." data-ref="25·29쪽"></aside>
    </div>
    <section class="lot-sec" id="condition" data-condition aria-label="Condition"></section>
    <section class="lot-sec" id="price" data-price aria-label="Price and market"></section>
    <section class="lot-sec" id="details" data-details aria-label="Details"></section>
    <section class="lot-sec" id="similar" data-similar aria-label="Similar pieces"></section>
  </div>
</main>

<div class="sticky-bar" data-sticky data-note="스크롤해도 따라오는 구매 바. 데스크톱은 오른쪽 칸이 화면 밖으로 나가면 위에, 모바일은 늘 아래(엄지 닿는 곳)." data-ref="28쪽"></div>
<footer id="foot"></footer>
