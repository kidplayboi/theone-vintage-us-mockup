<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — TheOne Vintage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C2219'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='600' text-anchor='middle' fill='%23FFFFFF'%3ETV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css?v=f35c47a528">
<link rel="stylesheet" href="css/base.css?v=f35c47a528">
<link rel="stylesheet" href="css/chrome.css?v=f35c47a528">
<link rel="stylesheet" href="css/pages.css?v=f35c47a528">
<link rel="stylesheet" href="css/review.css?v=f35c47a528">
</head>
<body>
<div id="review"></div>
<header id="top"></header>
<main class="auth-page">
  <section class="auth-side" aria-label="Why create an account" data-note="가입할 이유를 왼쪽에 사실로(Bezel 가입 유도 · 21쪽 판매가 회원 전용). 연회색 타일 — 초록은 머리띠·경매 띠·CTA 세 자리만(결정 74). 사진은 실재고. 시안이라 실제 로그인은 없다 — 누르면 로그인 상태로 바뀐다." data-ref="21쪽 · 결정 58·62·74">
    <h2 class="display d1">One account for bidding, saved lots and sold prices</h2>
    <ul class="auth-perks">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Bid on live auctions in US dollars</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>See the hammer price of every sold lot</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Keep your questions, offers and saved lots in one place</li>
    </ul>
    <div class="auth-tiles" data-auth-tiles></div>
  </section>
  <form class="auth-form" novalidate data-signin>
    <div class="auth-switch" role="tablist" aria-label="Account">
      <button type="button" role="tab" data-mode="login" aria-selected="true">Log in</button>
      <button type="button" role="tab" data-mode="create" aria-selected="false">Create account</button>
    </div>
    <h1 class="display d2" data-auth-title>Welcome back</h1>
    <label class="field"><span>Email</span><input class="input" type="email" name="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input class="input" type="password" name="password" autocomplete="current-password" required minlength="8"></label>
    <p class="field-error" data-auth-error role="alert"></p>
    <button class="btn block" type="submit" data-auth-submit>Log in</button>
    <p class="t13 muted">Asking about a lot is open to anyone — no account needed.</p>
  </form>
</main>
<footer id="foot"></footer>
<script type="module">
  import { startPage } from './js/page.js?v=f35c47a528';
  import * as store from './js/store.js?v=f35c47a528';
  const params = new URLSearchParams(location.search);
  const form = document.querySelector('[data-signin]');
  const setMode = mode => {
    form.dataset.mode = mode;
    form.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
    form.querySelector('[data-auth-title]').textContent = mode === 'create' ? 'Create your account' : 'Welcome back';
    form.querySelector('[data-auth-submit]').textContent = mode === 'create' ? 'Create account' : 'Log in';
    form.password.autocomplete = mode === 'create' ? 'new-password' : 'current-password';
  };
  setMode(params.get('mode') === 'create' ? 'create' : 'login');
  form.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  startPage({ page: 'signin' }).then(data => {
    if (!data) return;
    const ids = ['863-38440', '865-39616', '865-39358', '866-39839'];
    document.querySelector('[data-auth-tiles]').innerHTML = ids.map(id => data.lots.find(x => x.lot === id)).filter(Boolean)
      .map(l => `<span><img src="assets/lots/${l.lot}/card.jpg" alt="" width="600" height="600" loading="lazy"></span>`).join('');
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const err = form.querySelector('[data-auth-error]');
    const email = form.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Please enter a valid email address.'; form.email.focus(); return; }
    if (form.password.value.length < 8) { err.textContent = 'Your password needs at least 8 characters.'; form.password.focus(); return; }
    err.textContent = '';
    store.set('signedIn', true);
    // 돌아갈 곳은 이 사이트 안의 .html 만(외부로 튀는 리다이렉트 차단)
    const next = params.get('next') || '';
    location.href = /^[a-z-]+\.html([?#][\w=&%.#-]*)?$/i.test(next) ? next : 'index.html';
  });
</script>
</body>
</html>
