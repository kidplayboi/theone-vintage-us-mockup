    <section aria-label="Order status" data-pay-left data-note="낙찰 뒤 7상태(결정 78 · v4-lock §7): Won → Invoice(3일 안 결제 · Catawiki) → Paid · in escrow(Chrono24 · Bezel) → Inspected & packed in Tokyo(2~3영업일 · Bezel) → Shipped(날짜 범위 · Baymard) → Delivered(3일 신고 창 · Catawiki) → Complete. 상세 화면의 상태는 점 + 글(규칙 D2). 검토 막대 '결제 상태'로 단계를 바꿔 볼 수 있다." data-ref="v4-lock §7"></section>
    <aside class="invoice" aria-label="Invoice" data-pay-invoice data-note="청구서 1장 = 더윈 1·8·10·15·16: 낙찰가 · 수수료 10% · 관세(재질별) · DHL 배송 + 단단한 상자(선택, 더윈 8) · 감정서(선택) · 총액. 전부 결제 전에 보인다(Baymard: 총액 선노출 · 도착 '날짜' · 전화번호 요구 이유). 결제 수단은 Loupe 모델(카드 $10,000 까지 +3% / 송금). 요율·기한은 정책 확정 전 예시." data-ref="v4-lock §7 · 더윈 1·8·10·16"></aside>
